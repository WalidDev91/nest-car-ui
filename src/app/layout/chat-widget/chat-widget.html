<div class="chat-root" *ngIf="canUse()" [class.dark]="themeService.theme() === 'dark'">

    <div class="chat-panel" *ngIf="isOpen()">

        <div class="chat-header">

            <div class="chat-title">
                <span class="status-dot"></span>
                Nest-Car Assistant
            </div>

            <div class="chat-actions">

                <button type="button" title="Clear chat" (click)="clear()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>

                <button type="button" title="Close" (click)="toggle()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

            </div>

        </div>

        <div class="chat-body" #scrollArea>

            <div class="welcome" *ngIf="messages().length === 0">

                <p class="welcome-title">Hi! Ask me about your fleet.</p>
                <p class="welcome-sub">Drivers, vehicles, missions, documents and inspections.</p>

                <div class="chips">
                    <button type="button" class="chip" *ngFor="let s of suggestions" (click)="send(s)">
                        {{ s }}
                    </button>
                </div>

            </div>

            <div class="msg" *ngFor="let m of messages()" [class.user]="m.role === 'user'">

                <div class="bubble" *ngIf="m.role === 'user'">{{ m.text }}</div>

                <div class="bubble md" *ngIf="m.role === 'assistant'" [class.error]="m.error" [innerHTML]="m.html">
                </div>

            </div>

            <div class="msg" *ngIf="loading()">
                <div class="bubble typing"><span></span><span></span><span></span></div>
            </div>

        </div>

        <div class="chat-input">

            <input type="text" placeholder="Ask something..." [(ngModel)]="input" (keydown.enter)="send()"
                [disabled]="loading()" />

            <button type="button" class="send-btn" (click)="send()" [disabled]="loading() || !input.trim()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>

        </div>

    </div>

    <button type="button" class="chat-fab" (click)="toggle()" title="Chat with the assistant">

        <svg *ngIf="!isOpen()" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>

        <svg *ngIf="isOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>

    </button>

</div>
