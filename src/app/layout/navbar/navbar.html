	<div class="navbar-collapse collapse">

			<!-- ========================= -->
			<!-- THEME TOGGLE -->
			<!-- ========================= -->

			<li class="nav-item">

				<a class="nav-icon" href="#" (click)="toggleTheme(); $event.preventDefault()" title="Toggle dark mode">

					<span [innerHTML]="themeIconSvg"></span>

				</a>

			</li>


			<!-- ========================= -->
			<!-- NOTIFICATIONS -->
			<!-- ========================= -->

			<li class="nav-item dropdown">

				<a class="nav-icon dropdown-toggle" href="#" id="notificationsDropdown" data-bs-toggle="dropdown"
					(click)="loadNotifications(); $event.preventDefault()">

					<div class="position-relative">

						<i class="align-middle" data-feather="bell">
						</i>

						<span class="indicator" *ngIf="unreadCount() > 0">

							{{ unreadCount() > 9 ? '9+' : unreadCount() }}

						</span>

					</div>

				</a>


				<!-- ========================= -->
				<!-- NOTIFICATION DROPDOWN -->
				<!-- ========================= -->

				<div class="dropdown-menu dropdown-menu-lg dropdown-menu-end py-0 notification-dropdown"
					[class.notification-dark]="isDarkMode()" [class.notification-light]="!isDarkMode()">


					<!-- HEADER -->

					<div
						class="dropdown-menu-header d-flex justify-content-between align-items-center notification-header">

						<span>
							Notifications
						</span>

						<button *ngIf="unreadCount() > 0" class="btn btn-link btn-sm p-0"
							(click)="markAllAsRead($event)">

							Mark all as read

						</button>

					</div>


					<!-- NOTIFICATION LIST -->

					<div class="list-group list-group-flush notification-list"
						style="max-height: 320px; overflow-y: auto;">


						<!-- NOTIFICATIONS -->

						<div *ngFor="let notification of notifications()"
							class="list-group-item list-group-item-action notification-item"
							[class.notification-unread]="!notification.isRead"
							(click)="onNotificationClick(notification)">

							<div class="d-flex align-items-start">

								<div class="me-3">

									<i class="align-middle" [ngClass]="getNotificationColorClass(notification.type)"
										[attr.data-feather]="getNotificationIcon(notification.type)">
									</i>

								</div>


								<div class="flex-grow-1">

									<div>
										{{ notification.title }}
									</div>

									<div class="small notification-message">

										{{ notification.message }}

									</div>

								</div>

							</div>

						</div>


						<!-- EMPTY -->

						<div *ngIf="notifications().length === 0"
							class="list-group-item text-center py-4 notification-empty">

							No notifications yet.

						</div>

					</div>

				</div>

			</li>

					</ng-container>


					<ng-template #initialsAvatar>

						<div

					<div class="dropdown-divider"></div>


					<a class="dropdown-item text-danger" (click)="logout()">
