<div class="toast-stack">

    <div *ngFor="let toast of toastService.toasts()" class="toast show align-items-center border-0" [ngClass]="{
      'text-bg-success': toast.type === 'success',
      'text-bg-danger': toast.type === 'danger',
      'text-bg-info': toast.type === 'info'
    }" role="alert">

        <div class="d-flex">
            <div class="toast-body">{{ toast.message }}</div>
            <button class="btn-close btn-close-white me-2 m-auto" (click)="toastService.dismiss(toast.id)"></button>
        </div>

    </div>

</div>
