<main class="d-flex w-100">
    <div class="container d-flex flex-column">
        <div class="row vh-100">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
                <div class="d-table-cell align-middle">

                    <div class="text-center mt-4">
                        <h1 class="h2">Forgot Password</h1>
                        <p class="lead">
                            Enter your email and we'll send you a reset link.
                        </p>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="m-sm-3">

                                <!-- SUCCESS STATE -->
                                <div *ngIf="submitted()" class="text-center py-4">
                                    <h4>Check your inbox</h4>
                                    <p class="text-muted">
                                        We sent a password reset link to <strong>{{ email }}</strong>
                                    </p>
                                    <a routerLink="/auth/login" class="btn btn-primary mt-2">
                                        Back to Login
                                    </a>
                                </div>

                                <!-- FORM STATE -->
                                <form *ngIf="!submitted()" (ngSubmit)="submit()">

                                    <div class="form-error-alert" *ngIf="error()">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="12"></line>
                                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                        </svg>
                                        <span>{{ error() }}</span>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input class="form-control form-control-lg" type="email"
                                            placeholder="Enter your email" [(ngModel)]="email" name="email" />
                                        <small class="text-danger d-block mt-1" *ngIf="emailInvalid">Email is
                                            required.</small>
                                    </div>

                                    <div class="d-grid gap-2 mt-3">
                                        <button type="submit" class="btn btn-lg btn-primary" [disabled]="loading()">
                                            {{ loading() ? 'Sending...' : 'Send Reset Link' }}
                                        </button>
                                    </div>

                                    <div class="text-center mt-3">
                                        <a routerLink="/auth/login" class="text-muted">
                                            Back to Login
                                        </a>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
