<main class="d-flex w-100">
  <div class="container d-flex flex-column">
    <div class="row vh-100">
      <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
        <div class="d-table-cell align-middle">

          <div class="text-center mt-4">
            <h1 class="h2">Welcome back!</h1>
            <p class="lead">
              Sign in to your account to continue
            </p>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="m-sm-3">

                <div class="form-error-alert" *ngIf="error()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  <span>{{ error() }}</span>
                </div>

                <form (ngSubmit)="login()">

                  <!-- EMAIL -->
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control form-control-lg" type="email" name="email" placeholder="Enter your email"
                      [(ngModel)]="email" />
                    <small class="text-danger d-block mt-1" *ngIf="emailInvalid">Email is required.</small>
                  </div>

                  <!-- PASSWORD -->
                  <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control form-control-lg" type="password" name="password"
                      placeholder="Enter your password" [(ngModel)]="password" />
                    <small class="text-danger d-block mt-1" *ngIf="passwordInvalid">Password is required.</small>
                  </div>

                  <!-- FORGOT PASSWORD -->
                  <div class="d-flex justify-content-end">
                    <a routerLink="/auth/forgot-password" class="text-primary text-decoration-none">
                      Forgot password?
                    </a>
                  </div>

                  <!-- BUTTON -->
                  <div class="d-grid gap-2 mt-3">
                    <button type="submit" class="btn btn-lg btn-primary" [disabled]="loading()">
                      {{ loading() ? 'Signing in...' : 'Sign in' }}
                    </button>
                  </div>

                </form>

              </div>
            </div>
          </div>

          <div class="text-center mb-3">
            Don't have an account?
            <a routerLink="/auth/register" class="text-primary">
              Sign up
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</main>
