<main class="d-flex w-100">
    <div class="container d-flex flex-column">
        <div class="row vh-100">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
                <div class="d-table-cell align-middle">

                    <div class="text-center mt-4">
                        <h1 class="h2">Reset Password</h1>
                        <p class="lead">Enter your new password below.</p>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="m-sm-3">

                                <!-- SUCCESS -->
                                <div *ngIf="success()" class="text-center py-4">

                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                        fill="none" stroke="#198754" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" class="mb-3">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                    </svg>

                                    <h4>Password Reset!</h4>

                                    <p class="text-muted">
                                        Redirecting to login in 3 seconds...
                                    </p>

                                    <a routerLink="/auth/login" class="btn btn-primary mt-2">
                                        Go to Login
                                    </a>
                                </div>

                                <!-- FORM -->
                                <form *ngIf="!success()" (ngSubmit)="submit()">

                                    <div class="form-error-alert" *ngIf="error()">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="12"></line>
                                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                        </svg>
                                        <span>{{ error() }}</span>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">New Password</label>
                                        <input class="form-control form-control-lg" type="password"
                                            placeholder="At least 6 characters" [(ngModel)]="newPassword"
                                            name="newPassword">
                                        <small class="text-danger d-block mt-1" *ngIf="newPasswordInvalid">
                                            Password must be at least 6 characters.
                                        </small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Confirm Password</label>
                                        <input class="form-control form-control-lg" type="password"
                                            placeholder="Confirm new password" [(ngModel)]="confirmPassword"
                                            name="confirmPassword">
                                        <small class="text-danger d-block mt-1" *ngIf="confirmPasswordInvalid">
                                            Passwords don't match.
                                        </small>
                                    </div>

                                    <div class="d-grid gap-2 mt-3">
                                        <button type="submit" class="btn btn-lg btn-primary"
                                            [disabled]="loading() || !token">
                                            {{ loading() ? 'Resetting...' : 'Reset Password' }}
                                        </button>
                                    </div>

                                    <div class="text-center mt-3">
                                        <a routerLink="/auth/login" class="text-muted">
                                            Back to Login
                                        </a>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
